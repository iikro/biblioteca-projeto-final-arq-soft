services:
  db:
    image: postgres:15-alpine
    container_name: biblioteca_db
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: "123"
      POSTGRES_DB: biblioteca
    ports:
      - "${DB_HOST_PORT:-5434}:5432"
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U admin -d biblioteca"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    container_name: biblioteca_api
    ports:
      - "3000:3000"
    environment:
      DB_HOST: db
      DB_USER: admin
      DB_PASSWORD: "123"
      DB_NAME: biblioteca
      DB_PORT: "5432"
    depends_on:
      db:
        condition: service_healthy
